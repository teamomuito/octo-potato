name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, like v1.1. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional. Without these secrets the apk is signed with a throwaway debug key.
      - name: Unpack signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OCTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OCTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OCTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk octo-potato.apk

      - name: Which key signed it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs octo-potato.apk | grep -E "certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: octo-potato-apk
          path: octo-potato.apk

      # Two ways to release:
      #  - run this workflow by hand with a tag name; notes come from .github/releases/<tag>.md
      #  - push a tag. A tag with a message (git tag -a) becomes the notes, first line is the title.
      #    Tags made on github.com's release page have no message, so those keep what was typed there.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        id: notes
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then
            echo "tag=$RELEASE" >> "$GITHUB_OUTPUT"
            echo "title=octo potato ${RELEASE#v}" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
            if [ -f ".github/releases/$RELEASE.md" ]; then cp ".github/releases/$RELEASE.md" release-notes.md; else : > release-notes.md; fi
            exit 0
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          # checkout can fetch annotated tags as plain ones, so grab the real tag object first
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Publish release
        if: steps.notes.outputs.custom == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: octo-potato.apk

      - name: Attach to release written on github
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.custom != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: octo-potato.apk
