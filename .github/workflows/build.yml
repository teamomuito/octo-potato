name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional. Without these secrets the apk is signed with a throwaway debug key.
      - name: Unpack signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OCTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OCTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OCTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk octo-potato.apk

      - uses: actions/upload-artifact@v4
        with:
          name: octo-potato-apk
          path: octo-potato.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: octo-potato.apk
