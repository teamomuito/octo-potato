name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Without these secrets the apk is signed with a throwaway debug key. Fine for
      # everyday builds, but a release signed that way couldn't be updated later.
      - name: No release without the real key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::The KEYSTORE_BASE64 secret is missing, so this release would be signed with a throwaway key."
          exit 1

      - name: Unpack signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OCTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OCTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OCTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk octo-potato.apk

      - name: Which key signed it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs octo-potato.apk | grep -E "certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: octo-potato-apk
          path: octo-potato.apk

      # A tag pushed with a message (git tag -a) becomes the release text: first line is the
      # title, the rest is the body. Tags made on github.com's release page have no message,
      # so those releases keep whatever was typed there and just get the apk.
      # Checkout can fetch annotated tags as plain ones, so grab the real tag object first.
      - name: Release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            echo "annotated=true" >> "$GITHUB_OUTPUT"
            echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Attach to release, notes from the tag
        if: steps.notes.outputs.annotated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: octo-potato.apk

      - name: Attach to release, notes from github
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.annotated != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: octo-potato.apk
