name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional. Without these secrets the apk is signed with a throwaway debug key.
      - name: Unpack signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OCTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OCTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OCTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk octo-potato.apk

      - uses: actions/upload-artifact@v4
        with:
          name: octo-potato-apk
          path: octo-potato.apk

      # The release text is the tag's message: first line is the title, the rest is the body.
      # Checkout can fetch annotated tags as plain ones, so grab the real tag object first.
      - name: Release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title || github.ref_name }}
          body_path: release-notes.md
          files: octo-potato.apk
